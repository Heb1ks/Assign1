name: ci

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push doctor-service
        uses: docker/build-push-action@v5
        with:
          context: ./doctor-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/doctor-service:latest

      - name: build and push appointment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./appointment-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/appointment-service:latest

      - name: build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notification-service:latest

      - name: build and push mock-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./mock-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mock-gateway:latest